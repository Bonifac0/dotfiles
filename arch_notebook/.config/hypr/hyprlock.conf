# ═══════════════════════════════════════════════════════════════════════════════
# Osaka Jade Hyprlock Configuration
# ═══════════════════════════════════════════════════════════════════════════════

general {
    hide_cursor = false
    immediate_render = true
}

# ─────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────

background {
    path = /home/michal/.config/hypr/wallpapers/osaka-jade-bg.jpg
    blur_passes = 0
}

# ─────────────────────────────────────────
# USER WIDGET
# ─────────────────────────────────────────

label {
    text = $USER
    font_size = 18
    color = rgb(87dcae)

    position = 0, 320
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ─────────────────────────────────────────
# CLOCK & DATE PANEL
# ─────────────────────────────────────────

shape {
    size = 430, 215
    position = 0, 180
    halign = center
    valign = center

    color = rgba(5, 15, 12, 0.85)
    border_size = 2
    border_color = rgba(57, 217, 138, 0.25)
    rounding = 20

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# CLOCK (24-hour HH:MM)
label {
    text = $TIME
    font_size = 86
    color = rgb(b8ffd9)

    position = 0, 210
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# DATE (DD-MM-YYYY)
label {
    text = cmd[update:10000] date '+%d-%m-%Y'
    font_size = 20
    color = rgb(87dcae)

    position = 0, 130
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ─────────────────────────────────────────
# BATTERY PANEL & WIDGET
# ─────────────────────────────────────────

shape {
    size = 330, 58
    position = 0, 10
    halign = center
    valign = center

    color = rgba(5, 15, 12, 0.85)
    border_size = 2
    border_color = rgba(57, 217, 138, 0.25)
    rounding = 14

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

label {
    text = cmd[update:30000] /home/michal/.config/hypr/scripts/hyprlock-battery.sh
    font_size = 15

    position = 0, 10
    halign = center
    valign = center
}

# ─────────────────────────────────────────
# PASSWORD FIELD
# ─────────────────────────────────────────

input-field {
    size = 420, 68
    position = 0, -100
    halign = center
    valign = center

    rounding = 18
    outline_thickness = 2

    outer_color = rgb(39d98a)
    inner_color = rgba(5, 18, 14, 0.88)
    font_color = rgb(d8ffe8)

    check_color = rgb(39d98a)
    fail_color = rgb(ff4f81)

    dots_center = true
    fade_on_empty = false

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# AUTHENTICATION FAILURE MESSAGE
label {
    text = $FAIL
    color = rgb(ff6b91)
    font_size = 14

    position = 0, -155
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ─────────────────────────────────────────
# POWER ACTIONS (SUSPEND, REBOOT, SHUTDOWN)
# ─────────────────────────────────────────

# SUSPEND BUTTON
shape {
    size = 120, 46
    position = -140, -220
    halign = center
    valign = center

    color = rgba(5, 15, 12, 0.86)
    border_size = 2
    border_color = rgba(184, 255, 217, 0.25)
    rounding = 12

    onclick = systemctl suspend

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

label {
    text = SUSPEND
    font_size = 12
    color = rgb(b8ffd9)

    position = -140, -220
    halign = center
    valign = center

    onclick = systemctl suspend
}

# REBOOT BUTTON
shape {
    size = 120, 46
    position = 0, -220
    halign = center
    valign = center

    color = rgba(5, 15, 12, 0.86)
    border_size = 2
    border_color = rgba(135, 220, 174, 0.25)
    rounding = 12

    onclick = systemctl reboot

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

label {
    text = REBOOT
    font_size = 12
    color = rgb(87dcae)

    position = 0, -220
    halign = center
    valign = center

    onclick = systemctl reboot
}

# SHUTDOWN BUTTON
shape {
    size = 120, 46
    position = 140, -220
    halign = center
    valign = center

    color = rgba(5, 15, 12, 0.86)
    border_size = 2
    border_color = rgba(255, 79, 129, 0.3)
    rounding = 12

    onclick = systemctl poweroff

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

label {
    text = SHUTDOWN
    font_size = 12
    color = rgb(ff87a8)

    position = 140, -220
    halign = center
    valign = center

    onclick = systemctl poweroff
}

# ─────────────────────────────────────────
# KEYBOARD LAYOUT
# ─────────────────────────────────────────

label {
    text = $LAYOUT
    font_size = 13
    color = rgba(135, 220, 174, 0.45)

    position = 0, 40
    halign = center
    valign = bottom
}
